<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio de Sabores</title>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <div class="container header-content">
      <h1 class="brand-title">Cardápio de Sabores</h1>
      <button id="theme-toggle" class="btn-theme" aria-label="Alternar Tema">
        🌙
      </button>
    </div>
  </header>

  <main class="container">
    <section class="menu-section">
      <h2 class="section-title">Nossos Sabores</h2>
      
      <div class="products-grid">
        
        <article class="product-card">
          <img 
            src="https://via.placeholder.com/300x200" 
            alt="Foto do produto" 
            class="product-image"
          >
          <div class="product-info">
            <h3 class="product-name">Sabor Especial</h3>
            <p class="product-description">
              Descrição detalhada do produto com ingredientes selecionados.
            </p>
            <span class="product-price">R$ 25,00</span>
          </div>
        </article>

        <article class="product-card">
          <img 
            src="https://via.placeholder.com/300x200" 
            alt="Foto do produto" 
            class="product-image"
          >
          <div class="product-info">
            <h3 class="product-name">Sabor Tradicional</h3>
            <p class="product-description">
              Receita clássica preparada com ingredientes de alta qualidade.
            </p>
            <span class="product-price">R$ 18,50</span>
          </div>
        </article>

      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
