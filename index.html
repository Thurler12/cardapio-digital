<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorveteria - Cardápio de Sabores</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="app-header">
    <div class="container header-content">
      <h1 class="brand-title">Sabores do Dia 🍦</h1>
      <div class="header-actions">
        <!-- Ícone do Gerente (Login) -->
        <a href="login.html" class="btn-theme" aria-label="Área do Gerente" title="Área Administrativa">
          🔑
        </a>
        <!-- Botão Alternar Tema -->
        <button id="theme-toggle" class="btn-theme" aria-label="Alternar Tema">
          🌙
        </button>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL DA VITRINE -->
  <main class="container">
    <section class="menu-section">
      <h2 class="section-title">Nossos Sabores</h2>
      
      <!-- Filtros por Categoria (Ajustado 'Todos' com T maiúsculo) -->
      <div class="category-filters">
        <button class="filter-btn active" data-category="Todos">Todos</button>
        <button class="filter-btn" data-category="Tradicionais">Tradicionais</button>
        <button class="filter-btn" data-category="Sem Lactose">Sem Lactose</button>
        <button class="filter-btn" data-category="Sem Açúcar">Sem Açúcar</button>
        <button class="filter-btn" data-category="Vegano">Vegano</button>
      </div>

      <!-- Grade com o ID 'product-list' adicionado -->
      <div id="product-list" class="products-grid">
        <!-- Os cards dos sorvetes vão aparecer aqui via script.js -->
      </div>
    </section>
  </main>

  <!-- SCRIPT JS (Atualizado para v=13) -->
  <script type="module" src="script.js?v=13"></script>
</body>
</html>
