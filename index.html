<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio de Sabores</title>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <div class="container header-content">
      <h1 class="brand-title">Cardápio de Sabores</h1>
      <button id="theme-toggle" class="btn-theme" aria-label="Alternar Tema">
        🌙
      </button>
    </div>
  </header>

  <main class="container">
    <section class="menu-section">
      <h2 class="section-title">Sabores do dia</h2>
      
      <div class="products-grid">
        
        <article class="product-card">
          <img 
            src="https://via.placeholder.com/300x200" 
            alt="Foto do produto" 
            class="product-image"
          >
          <div class="product-info">
            <h3 class="product-name">Camafeu</h3>
            <p class="product-description">
              Sorvete de nozes com doce de leite.
            </p>
          </div>
        </article>

        <article class="product-card">
          <img 
            src="https://via.placeholder.com/300x200" 
            alt="Foto do produto" 
            class="product-image"
          >
          <div class="product-info">
            <h3 class="product-name">Chocolate Belga</h3>
            <p class="product-description">
              Sorvete de chocolate ao leite.
            </p>
          </div>
        </article>

          <article class="product-card">
            <img 
              src="https://via.placeholder.com/300x200" 
              alt="Foto do produto" 
              class="product-image"
            >
            <div class="product-info">
              <h3 class="product-name">Ninho com Morango</h3>
              <p class="product-description">
                Sorvete de leite ninho com uma camada de chocolate branco e geleia de morango.
              </p>
            </div>
          </article>       

      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
