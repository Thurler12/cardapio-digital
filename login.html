<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Área Administrativa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <!-- CABEÇALHO -->
  <header class="app-header">
    <div class="container header-content">
      <h1 class="brand-title">Gelateria & Sabores 🍦</h1>
      <a href="index.html" class="btn-link">← Voltar ao Cardápio</a>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="container login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon">🔐</div>
        <h2 class="login-title">Área do Gerente</h2>
        <p class="login-subtitle">Acesse para gerenciar os sabores do cardápio</p>
      </div>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="gerente@gelateria.com" 
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••" 
            required
          >
        </div>

        <button type="submit" class="btn-primary">Entrar no Painel</button>
      </form>

      <!-- MENSAGEM DE ERRO -->
      <div id="login-error" class="login-error hidden">
        ⚠️ E-mail ou senha incorretos!
      </div>
    </div>
  </main>

    <script type="module" src="script.js?v=3"></script>
</body>
</html>
