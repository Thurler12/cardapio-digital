<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - Sorveteria</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Garante que elementos escondidos fiquem ocultos */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body class="login-page">

  <!-- CABEÇALHO -->
  <header class="app-header">
    <h1>Painel Administrativo</h1>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="container">

    <!-- 1. TELA DE LOGIN (Aparece se NÃO estiver logado) -->
    <div id="login-container">
      <h2>Área Restrita</h2>
      <p style="margin-bottom: 20px; color: var(--text-muted);">Faça login para gerenciar o cardápio</p>
      
      <form id="login-form">
        <div class="form-group">
          <label for="admin-user">E-mail</label>
          <input type="email" id="admin-user" required placeholder="seuemail@exemplo.com">
        </div>

        <div class="form-group">
          <label for="admin-pass">Senha</label>
          <input type="password" id="admin-pass" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-primary">Entrar no Painel</button>
      </form>
    </div>

    <!-- 2. PAINEL ADMIN (Inicia oculto com 'hidden' e só abre após o Login) -->
    <div id="admin-panel" class="hidden">
      
      <!-- Topo do Painel: Informações do Usuário e Logout -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <p id="user-info-tag" style="font-weight: bold; color: var(--primary); margin: 0;"></p>
        <button id="btn-logout" class="btn-delete" style="padding: 6px 12px;">Sair</button>
      </div>

      <!-- Formulário de Cadastro / Edição -->
      <section class="admin-section">
        <h2 id="form-title" class="section-title">Cadastrar Novo Sabor</h2>
        
        <form id="product-form">
          <input type="hidden" id="edit-id">

          <div class="form-group">
            <label for="prod-name">Nome do Sabor</label>
            <input type="text" id="prod-name" required placeholder="Ex: Ninho com Nutella">
          </div>

          <div class="form-group">
            <label for="prod-category">Categoria / Restrição</label>
            <select id="prod-category" required>
              <option value="Tradicionais">Tradicionais</option>
              <option value="Sem Lactose">Sem Lactose</option>
              <option value="Sem Açúcar">Sem Açúcar / Zero</option>
              <option value="Vegano">Vegano</option>
              <option value="Picolés">Picolés</option>
            </select>
          </div>

          <div class="form-group">
            <label for="prod-desc">Descrição / Ingredientes</label>
            <input type="text" id="prod-desc" placeholder="Ex: Gelato de ninho com recheio concentrado...">
          </div>

          <div class="form-group">
            <label for="prod-img">Foto do Sabor</label>
            <input type="file" id="prod-img" accept="image/*" required>
          </div>

          <div style="display: flex; gap: 10px;">
            <button type="submit" id="btn-submit" class="btn-primary">+ Adicionar Sabor</button>
            <button type="button" id="btn-cancel-edit" class="btn-delete hidden">Cancelar</button>
          </div>
        </form>
      </section>

      <!-- Lista de Sabores Cadastrados -->
      <section class="admin-section">
        <h2 class="section-title">Sabores no Cardápio</h2>
        <div id="admin-product-list">
          <!-- Os produtos renderizam aqui via JavaScript -->
        </div>
      </section>

    </div>

  </main>

  <!-- Script configurado como módulo ES6 -->
 <script type="module" src="script.js?v=3"></script>
</body>
</html>
